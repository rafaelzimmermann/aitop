[package]
name = "aitop"
version = "0.1.0"
edition = "2021"
description = "htop for AI usage: live quota dashboard for Codex, z.ai and OpenRouter"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.11", features = ["json"] }
dotenvy = "0.15"
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
lto = true
codegen-units = 1
